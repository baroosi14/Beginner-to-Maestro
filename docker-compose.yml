version: '3.9'

services:
  # -------------------------------------------------------
  # MySQL 8
  # -------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: btm_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE:      ${DB_DATABASE:-beginner_to_maestro}
      MYSQL_USER:          ${DB_USERNAME:-btm_user}
      MYSQL_PASSWORD:      ${DB_PASSWORD:-btm_password}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------
  # PHP 8.2 + Apache (Backend API)
  # -------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: btm_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV:            production
      APP_URL:            ${APP_URL:-http://localhost:8000}
      DB_HOST:            db
      DB_PORT:            3306
      DB_DATABASE:        ${DB_DATABASE:-beginner_to_maestro}
      DB_USERNAME:        ${DB_USERNAME:-btm_user}
      DB_PASSWORD:        ${DB_PASSWORD:-btm_password}
      JWT_SECRET:         ${JWT_SECRET:-change_this_secret}
      ALLOWED_ORIGINS:    ${ALLOWED_ORIGINS:-http://localhost:3000}
      STORAGE_DRIVER:     ${STORAGE_DRIVER:-local}
      PAYSTACK_SECRET_KEY:    ${PAYSTACK_SECRET_KEY:-}
      FLUTTERWAVE_SECRET_KEY: ${FLUTTERWAVE_SECRET_KEY:-}
      STRIPE_SECRET_KEY:      ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET:  ${STRIPE_WEBHOOK_SECRET:-}
      PAYPAL_CLIENT_ID:       ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET:   ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_MODE:            ${PAYPAL_MODE:-sandbox}
    ports:
      - "8000:80"
    volumes:
      - storage:/var/www/html/storage

  # -------------------------------------------------------
  # React Web Frontend (Nginx)
  # -------------------------------------------------------
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api}
    container_name: btm_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  db_data:
  storage:
